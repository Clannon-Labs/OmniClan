[workspace]
resolver = "3"

# All our crates
members = [
    "crates/api",
]

# What to run if i did cargo run from backend root
default-members = [
    "crates/api",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
anyhow = "1.0.104"
reqwest = {
    version = "0.12",
    default-features = false,
    features = ["rustls-tls", "json"]
}
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"


